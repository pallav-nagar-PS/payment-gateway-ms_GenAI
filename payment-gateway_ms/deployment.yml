apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway-service
  labels:
    app: payment-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: registry.example.com/payment-gateway-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: CURRENCY_API_BASEURL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: currencyApiBaseUrl
            - name: CURRENCY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: currencyApiKey
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway-service
spec:
  selector:
    app: payment-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  currencyApiBaseUrl: "http://api.exchangeratesapi.io"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
type: Opaque
data:
  currencyApiKey: <base64-encoded-api-key>

---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: payment-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-gateway-service
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80